name: mergelings
description: "Mergelings — merge adorable creatures and fill five magical meadows."
publish_to: 'none'

version: 1.0.7+8

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: any

  # State management
  provider: ^6.1.5+1

  # Persistence
  shared_preferences: ^2.5.5

  # Sound effects
  # 6.8.x requires a newer Flutter SDK than this project targets.
  audioplayers: ^6.7.1

  # Monetisation
  google_mobile_ads: ^9.0.0
  app_tracking_transparency: ^2.0.7

  # Utilities
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/i18n/
    - assets/audio/
